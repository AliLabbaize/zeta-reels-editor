# Stage 1 transcription configuration.
#
# `default_backend` is the text source. Timing authority is ALWAYS local and
# acoustic (WhisperX forced alignment) unless `use_backend_timings: true`.
# Run `zeta benchmark` before changing the default. Do not decide from vibes.

default_backend: gemini_flash_lite   # gemini_flash_lite | gemini_transcribe | cohere_arabic
use_backend_timings: false           # true only for gemini_transcribe word-timestamp mode

second_opinion:
  enabled: false                     # needs COHERE_API_KEY; flags uncertain spans
  backend: cohere_arabic
  disagreement_threshold: 0.35       # normalized token distance over a span -> flagged
  recheck_uncertain: true            # re-transcribe flagged spans from short excerpts
  excerpt_margin_s: 1.0
  excerpt_min_s: 5.0
  excerpt_max_s: 15.0

backends:
  gemini_flash_lite:
    # 3.1 first: on real Darija 3.5 answers in Arabizi (l9aw, m3a) whatever the
    # prompt says, and Arabizi cannot be aligned by the Arabic model. DEVIATIONS 11.
    model: gemini-3.1-flash-lite
    fallback_model: gemini-3.5-flash-lite
    # VERBATIM. Never SMART: filler removal destroys the editorial signal (hard rule 8).
    # 60 s, not 600: on a 6 min take long chunks made the model's clock run 5%
    # long and collapse repeated takes, which threw the alignment off by seconds.
    chunk_s: 60
    chunk_overlap_s: 2.0
    temperature: 0.0
  gemini_transcribe:
    model: gemini-3.5-transcribe
    mode: VERBATIM
    word_timestamp: true
    chunk_s: 900
  cohere_arabic:
    model: cohere-transcribe-arabic-07-2026
    api_max_bytes: 26214400          # 25 MB API cap -> chunk audio below this
    chunk_s: 240
    local_weights: null              # set to a local path to run the open weights instead

alignment:
  model: jonatasgrosman/wav2vec2-large-xlsr-53-arabic
  english_model: WAV2VEC2_ASR_BASE_960H
  interpolate_method: ignore
  boundary_search_s: 1.5             # windows split at the quietest frame near each
                                     # transcriber boundary, never at its timestamp
  device: auto                       # auto | cpu | cuda | mps (Apple GPU: 3x faster,
                                     # identical timings — see resolve_device)
  batch_size: 8
  # Latin/English spans are aligned with the English model and bounded by the
  # timestamps of the neighbouring Arabic words.
  align_latin_spans: true

qa:
  min_coverage: 0.95                 # fraction of words with usable timings
  max_word_duration_s: 2.0
  allow_overlaps: false
  realign_flagged_windows: true      # one automatic re-align pass on failing windows
  window_pad_s: 2.0
  fill_loud_gaps: false              # transcribe speech in word gaps; off: it cannot
                                     # tell a collapsed retake from a timing error
  low_score: 0.05                    # a run of low_score_run words below this is
  low_score_run: 3                   # re-aligned like an untimed one

# Custom vocabulary: biases gemini_transcribe and seeds the alignment alias map.
# Max 1000 terms. Names, tickers, French/English terms that Darija ASR mangles.
custom_vocabulary:
  - Zeta
  - زيتا
  - Nvidia
  - OpenAI
  - Anthropic
  - SpaceX
  - Tesla
  - Bitcoin
  - startup
  - milliard
  - million
  - pourcent
  - investissement
  - Maroc
  - Casablanca
  - درهم
  - دولار
  - البورصة
